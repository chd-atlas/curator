name: ci

on:
  pull_request:
  push:
    branches: [dev]
  # The atlas's schemas and its `literature target` command are what curator is
  # tested against, and they move without any change here; a weekly run notices.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Lint and types run before the atlas is checked out, so they never see `atlas/`.
      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy --strict src

      - name: Check out the atlas
        uses: actions/checkout@v4
        with:
          repository: chd-atlas/chd-atlas.github.io
          ref: dev
          path: atlas
          persist-credentials: false

      - name: Install the atlas
        working-directory: atlas
        run: uv sync --locked

      - name: Tests
        env:
          CHD_ATLAS_ROOT: ${{ github.workspace }}/atlas
          CHD_ATLAS_CLI: ${{ github.workspace }}/atlas/.venv/bin/chd-atlas
          CHD_ATLAS_PYTHON: ${{ github.workspace }}/atlas/.venv/bin/python
        run: uv run pytest
